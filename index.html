<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Weather Alerts Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>US Weather Alerts</h1>
        <p class="subtitle">Enter a U.S. state abbreviation (e.g., NY, CA, MN) to view active weather alerts.</p>
        
        <div class="search-box">
            <!-- Updated placeholder to match automated test expectations -->
            <input type="text" id="state-input" placeholder="Enter state abbreviation" maxlength="2">
            <button id="submit-btn">Get Weather Alerts</button>
        </div>

        <div id="error-message" class="hidden"></div>

        <div id="alerts-container">
            <h2 id="alerts-title"></h2>
            <ul id="alerts-list"></ul>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
